name: Publish to PyPI

# Este workflow gera o pacote (sdist + wheel) e o publica no PyPI usando
# "trusted publishing" (OIDC), sem precisar de um token de API guardado em
# secret. Ele só é executado quando uma release do GitHub é publicada, ou
# manualmente via workflow_dispatch — nunca em todo push.
#
# IMPORTANTE: antes do primeiro uso real, é preciso configurar o projeto
# "organizador-arquivos" como um "trusted publisher" no PyPI (Account
# Settings > Publishing), apontando para este repositório, workflow e
# ambiente. Isso só pode ser feito pelo dono da conta PyPI - este workflow
# fica pronto, mas não publica nada sozinho até essa configuração existir.
on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar a ferramenta de build
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Gerar sdist e wheel
        run: python -m build

      - name: Guardar artefatos do pacote
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Baixar artefatos do pacote
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist/

      - name: Publicar no PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
