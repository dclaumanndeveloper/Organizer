name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      versao_teste:
        description: >-
          Nome da tag a usar ao disparar manualmente (ex: v0.0.1-test).
          Ignorado quando o workflow roda por push de tag.
        required: false
        default: "v0.0.0-manual-test"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nome_saida: organizador-linux
          - os: windows-latest
            nome_saida: organizador-windows.exe
          - os: macos-latest
            nome_saida: organizador-macos.zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

      - name: Build executable (Linux/Windows)
        if: runner.os != 'macOS'
        run: pyinstaller --onefile --windowed --name organizador organizer.py

      - name: Build .app bundle (macOS)
        if: runner.os == 'macOS'
        run: pyinstaller --windowed --name organizador organizer.py

      - name: Empacotar .app em .zip (macOS)
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/organizador.app "dist/${{ matrix.nome_saida }}"

      - name: Renomear executável (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: mv "dist/organizador" "dist/${{ matrix.nome_saida }}"

      - name: Renomear executável (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item "dist/organizador.exe" "dist/${{ matrix.nome_saida }}"

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nome_saida }}
          path: dist/${{ matrix.nome_saida }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar todos os artefatos
        uses: actions/download-artifact@v4
        with:
          path: artefatos

      - name: Criar release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.versao_teste || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: artefatos/**/*
