name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      versao_teste:
        description: >-
          Nome da tag a usar ao disparar manualmente (ex: v0.0.1-test).
          Ignorado quando o workflow roda por push de tag.
        required: false
        default: "v0.0.0-manual-test"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nome_saida: organizador-linux
          - os: windows-latest
            nome_saida: organizador-windows.exe
          - os: macos-latest
            nome_saida: organizador-macos.zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Instalar Xvfb e Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk

      - name: Run tests (Linux, com display virtual)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest -v

      - name: Run tests
        if: runner.os != 'Linux'
        run: pytest -v

      - name: Build executable (Linux/Windows)
        if: runner.os != 'macOS'
        run: pyinstaller --onefile --windowed --name organizador organizer.py

      - name: Build .app bundle (macOS)
        if: runner.os == 'macOS'
        run: pyinstaller --windowed --name organizador organizer.py

      - name: Preparar AppDir (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          mkdir -p AppDir/usr/bin
          cp dist/organizador AppDir/usr/bin/organizador
          cat > AppDir/organizador.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Organizador de Arquivos
          Exec=organizador
          Icon=organizador
          Categories=Utility;
          Terminal=false
          EOF
          convert -size 256x256 xc:"#4C5FD5" AppDir/organizador.png

      - name: Gerar AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run AppDir dist/organizador-linux.AppImage

      - name: Gerar pacote .deb (Linux)
        if: runner.os == 'Linux'
        env:
          VERSAO_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.versao_teste || github.ref_name }}
        run: |
          VERSAO="${VERSAO_TAG#v}"
          mkdir -p deb/DEBIAN deb/usr/bin
          cp dist/organizador deb/usr/bin/organizador
          cat > deb/DEBIAN/control <<EOF
          Package: organizador-arquivos
          Version: ${VERSAO}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: dclaumanndeveloper
          Description: Organizador de arquivos com interface grafica (Tkinter)
          EOF
          dpkg-deb --build --root-owner-group deb dist/organizador-linux.deb

      - name: Instalar NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Gerar instalador NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsis = @'
          OutFile "dist\organizador-windows-installer.exe"
          InstallDir "$PROGRAMFILES\OrganizadorDeArquivos"
          Name "Organizador de Arquivos"
          Section "Instalar"
            SetOutPath "$INSTDIR"
            File "dist\organizador.exe"
            CreateShortcut "$SMPROGRAMS\Organizador de Arquivos.lnk" "$INSTDIR\organizador.exe"
            WriteUninstaller "$INSTDIR\uninstall.exe"
          SectionEnd
          Section "Uninstall"
            Delete "$INSTDIR\organizador.exe"
            Delete "$INSTDIR\uninstall.exe"
            Delete "$SMPROGRAMS\Organizador de Arquivos.lnk"
            RMDir "$INSTDIR"
          SectionEnd
          '@
          Set-Content -Path installer.nsi -Value $nsis
          $makensis = Get-Command makensis -ErrorAction SilentlyContinue
          if ($makensis) {
            & makensis installer.nsi
          } else {
            & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" installer.nsi
          }

      - name: Empacotar .app em .zip (macOS)
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/organizador.app "dist/${{ matrix.nome_saida }}"

      - name: Gerar imagem .dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname "Organizador de Arquivos" \
            -srcfolder dist/organizador.app -ov -format UDZO \
            dist/organizador-macos.dmg

      - name: Renomear executável (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: mv "dist/organizador" "dist/${{ matrix.nome_saida }}"

      - name: Renomear executável (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item "dist/organizador.exe" "dist/${{ matrix.nome_saida }}"

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nome_saida }}
          path: dist/${{ matrix.nome_saida }}

      - name: Upload do AppImage (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: organizador-linux.AppImage
          path: dist/organizador-linux.AppImage

      - name: Upload do pacote .deb (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: organizador-linux.deb
          path: dist/organizador-linux.deb

      - name: Upload do instalador NSIS (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: organizador-windows-installer.exe
          path: dist/organizador-windows-installer.exe

      - name: Upload da imagem .dmg (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: organizador-macos.dmg
          path: dist/organizador-macos.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar todos os artefatos
        uses: actions/download-artifact@v4
        with:
          path: artefatos

      - name: Criar release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.versao_teste || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: artefatos/**/*
