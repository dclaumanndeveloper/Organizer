name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nome_saida: organizador-linux
          - os: windows-latest
            nome_saida: organizador-windows.exe
          - os: macos-latest
            nome_saida: organizador-macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

      - name: Build executable
        run: pyinstaller --onefile --windowed --name organizador organizer.py

      - name: Renomear executável (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: mv "dist/organizador" "dist/${{ matrix.nome_saida }}"

      - name: Renomear executável (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item "dist/organizador.exe" "dist/${{ matrix.nome_saida }}"

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nome_saida }}
          path: dist/${{ matrix.nome_saida }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar todos os artefatos
        uses: actions/download-artifact@v4
        with:
          path: artefatos

      - name: Criar release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artefatos/**/*
