name: Test Python Application

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Ruff (lint)
      run: ruff check .

    - name: Black (formatação)
      run: black --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Instalar Xvfb e Tk (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk

    - name: Run tests (Linux, com display virtual)
      if: runner.os == 'Linux'
      run: xvfb-run -a pytest -v

    - name: Run tests
      if: runner.os != 'Linux'
      run: pytest -v
